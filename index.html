<!doctype html>
<html lang="en">
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="/" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="The ultimate drinking card game for parties. Play Truth or Dare, Never Have I Ever, and more with friends!" />

    <!-- Performance Optimizations -->
    <meta name="theme-color" content="#8B5CF6" />

    <!-- Preconnect to critical domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firebaselogging.googleapis.com">
    <link rel="dns-prefetch" href="https://firebase.googleapis.com">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="nokk_flutter" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>Nốkk - Drinking Card Game</title>
    <link rel="manifest" href="manifest.json" />

    <!-- Preload critical resources -->
    <link rel="preload" href="flutter_bootstrap.js" as="script">

    <!-- Firebase SDKs - Load async for better performance -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-performance-compat.js" defer></script>

    <style>
      /* Loading screen styles for better perceived performance */
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
        overflow: hidden;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0A0E27 0%, #1a1f3a 100%);
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #loading.fade-out {
        opacity: 0;
        pointer-events: none;
      }

      .loader {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8B5CF6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        color: #8B5CF6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 16px;
        font-weight: 500;
      }

      /* Prevent FOUC (Flash of Unstyled Content) */
      flutter-view {
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }

      flutter-view.loaded {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="loading">
      <div class="loader"></div>
      <div class="loading-text">Loading Nốkk...</div>
    </div>

    <!-- Firebase Configuration -->
    <!-- This will be auto-populated by FlutterFire CLI -->
    <script id="firebase-config">
      // Firebase configuration will be inserted here after running 'flutterfire configure'
      // The firebase_options.dart file will provide the configuration
    </script>

    <!-- Flutter Bootstrap -->
    <script src="flutter_bootstrap.js" async></script>

    <!-- Remove loading screen when Flutter is ready -->
    <script>
      window.addEventListener('flutter-first-frame', function() {
        var loading = document.getElementById('loading');
        var flutterView = document.querySelector('flutter-view');
        if (loading) {
          loading.classList.add('fade-out');
          setTimeout(function() {
            loading.remove();
          }, 300);
        }
        if (flutterView) {
          flutterView.classList.add('loaded');
        }
      });
    </script>

    <!-- Vercel Analytics - Load last -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </body>
</html>
